#GPU variant: requires NVIDIA Container Toolkit. Compose file version 2.3 is required for 'runtime: nvidia'.
#uses the same x86_64 codeBase image; TensorFlow will use GPU when available. For a dedicated GPU
version: "2.3"
services:
  knowledge_base:
    image: moazemad/knowledgebase_life_style_death_x86_64
    volumes:
      - ai_system:/tmp
    command:
      - sh
      - "-c"
      - |
        rm -rf /tmp/knowledgeBase/ && cp -r /knowledgeBase/ /tmp/;
  learning_base:
    image: moazemad/learningbase_life_style_death_x86_64
    volumes:
      - ai_system:/tmp
    command:
      - sh
      - "-c"
      - |
        rm -rf /tmp/learningBase/ && cp -r /learningBase/ /tmp/;
  activation_base:
    image: moazemad/activationbase_life_style_death_x86_64
    volumes:
      - ai_system:/tmp
    command:
      - sh
      - "-c"
      - |
        rm -rf /tmp/acGvaGonBase/ && cp -r /acGvaGonBase/ /tmp/;
  code_base:
    image: moazemad/codebase_life_style_death_x86_64
    runtime: nvidia
    volumes:
      - ai_system:/tmp
    depends_on:
      - knowledge_base
      - activation_base
    command:
      - sh
      - "-c"
      - |
        rm -rf /tmp/acGvaGonBase/ && cp -r /acGvaGonBase/ /tmp/;
        python3 /app/codeBase/run_inference.py
volumes:
  ai_system:
    external: true
